<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SIMPUS-Mini | Daftar Buku</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <header>
        <h1>SIMPUS-Mini</h1>
        <button type="button" id="nav-toggle-btn" class="nav-toggle-label" aria-label="Menu">&#9776;</button>
        <nav>
            <ul>
                <li><a href="../index.html">Beranda</a></li>
                <li><a href="../buku/list.html">Daftar Buku</a></li>
                <li><a href="../buku/tambah.html">Tambah Buku</a></li>
                <li><a href="../anggota/list.html">Daftar Anggota</a></li>
                <li><a href="../anggota/tambah.html">Tambah Anggota</a></li>
                <li><a href="../auth/login.html">Login</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Daftar Buku</h2>
            <p style="margin-bottom: 1rem;">
                <input type="text" id="search-input" placeholder="Cari judul buku..." style="padding: 0.5rem 0.75rem; width: 100%; max-width: 300px; border: 1px solid #ccc; border-radius: 4px;">
                <button type="button" id="btn-reload" style="padding: 0.5rem 0.75rem; cursor: pointer;">Muat Ulang</button>
            </p>
            <p id="table-counter" style="margin-bottom: 0.75rem; font-weight: 500; color: #55677a;"></p>
            <p id="loading-indicator" style="display: none; color: #55677a; font-style: italic;">Memuat data buku...</p>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Judul</th>
                            <th>Pengarang</th>
                            <th>Tahun</th>
                            <th>Stok</th>
                            <th>Kategori</th> <!-- Nomor 3: Penambahan Header Kolom Kategori -->
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="buku-list"> <!-- Nomor 3: Elemen tbody Kosong yang Akan Diisi Otomatis via JS -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 SIMPUS-Mini &mdash; Jobsheet 3</p>
    </footer>
    <script src="../assets/js/app.js"></script>
    <script src="../assets/js/buku.js"></script>
</body>
</html>
